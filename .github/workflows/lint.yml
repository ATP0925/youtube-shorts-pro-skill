name: Lint & Compile Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verify bytecode compilation (py_compile)
        run: |
          for file in scripts/*.py; do
            echo "Compiling $file..."
            python -m py_compile "$file"
          done

      - name: Run Ruff linter
        run: ruff check scripts/

      - name: Verify imports, JSON schemas, and SKILL.md
        run: |
          python - << 'EOF'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          for mod in [
              "constants",
              "exceptions",
              "logger",
              "config_loader",
              "build_channel_branding",
              "media_loudness_validator",
              "yt_channel_manager",
              "yt_studio_shorts_uploader",
              "youtube_shorts_daily_pipeline",
              "ig_reels_publisher",
              "viral_hook_analyzer",
              "auto_subtitle_styler",
              "copyright_free_shorts_factory",
          ]:
              __import__(mod)

          for ref_file in [
              "viral-hooks-retention.md",
              "editing-tools-automation.md",
              "algorithm-signals.md",
              "thumbnail-cover-optimization.md",
              "copyright-free-monetization-niches.md",
              "7-pillars-playbook.md",
          ]:
              assert (Path("references") / ref_file).exists(), f"Missing reference: {ref_file}"

          for jpath in Path("examples").glob("*.json"):
              json.loads(jpath.read_text(encoding="utf-8"))

          skill = Path("SKILL.md").read_text(encoding="utf-8")
          lines = skill.splitlines()
          assert len(lines) < 500, f"SKILL.md too long: {len(lines)} lines"
          assert lines[0].strip() == "---", "Missing YAML frontmatter start"
          assert "name: youtube-shorts-pro-skill" in skill, "Missing skill name"
          assert "triggers:" in skill, "Missing metadata triggers"
          print(f"All CI checks passed (SKILL.md: {len(lines)} lines)")
          EOF
